set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'omerxx/tmux-sessionx'
#set -g @plugin 'christoomey/vim-tmux-navigator'

# Searchable session navigation (SessionX)
set -g @sessionx-bind 'M-s'
set -g @sessionx-prefix off
set -g @sessionx-custom-paths ''
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-git-branch 'off'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-preview-enabled 'false'
set -g @sessionx-window-width '85%'
set -g @sessionx-window-height '70%'
set -g @sessionx-ls-command 'eza --icons --group-directories-first --color=always'
set -g @sessionx-prompt ' 󰆍  session › '
set -g @sessionx-pointer ' '
set -g @sessionx-additional-options '--color=bg+:#2c313a,bg:#21252b,spinner:#56b6c2,hl:#61afef,fg:#abb2bf,header:#636d83,info:#c678dd,pointer:#61afef,marker:#98c379,fg+:#dde1e8,prompt:#e5c07b,hl+:#61afef,border:#3e4451,label:#abb2bf'

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g base-index 1
set -g renumber-windows on
set -sg escape-time 0
setw -g mouse on

bind -n M-j previous-window
bind -n M-k next-window
bind -n M-h switch-client -p
bind -n M-l switch-client -n

bind-key f display-popup -E -w 80% -h 70% "~/.local/scripts/tmux-sessionizer"
bind-key s choose-tree -Zs
bind-key w choose-tree -Zw

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",*256col*:Tc"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set-window-option -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# OneDark UI
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#7f848e"
set -g status-left-length 30
set -g status-right-length 80

set -g status-left "#[bg=default,fg=#61afef,bold]  󰆍 #S  #[fg=#3e4451]│ "

set -g status-right "#[bg=default,fg=#636d83] 󰉋 #{b:pane_current_path}  #[fg=#3e4451]│#[fg=#e5c07b] 󰥔 %H:%M  #[fg=#3e4451]│#[fg=#56b6c2] 󰒋 #h  "

set -g window-status-format "#[bg=default,fg=#4b5263]  #I #[fg=#636d83]#W  "
set -g window-status-current-format "#[bg=default,fg=#61afef,bold]  ● #I #[fg=#abb2bf,bold]#W  "

set -g window-status-activity-style "fg=#e5c07b,bg=#21252b"
set -g window-status-bell-style "fg=#e06c75,bg=#21252b,bold"
set -g window-status-separator " "

set -g pane-border-style "fg=#2c313a"
set -g pane-active-border-style "fg=#61afef"
set -g pane-border-indicators colour

set -g message-style "fg=#e5c07b,bg=#282c34,bold"
set -g message-command-style "fg=#56b6c2,bg=#282c34"

set -g mode-style "fg=#282c34,bg=#61afef"

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

run '~/.tmux/plugins/tpm/tpm'
