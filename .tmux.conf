set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'omerxx/tmux-sessionx'

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

#set -g status-style 'bg=#333333 fg=#5eacd3'

set -g base-index 1

set -sg escape-time 0
setw -g mouse on

bind -n M-j previous-window
bind -n M-k next-window
bind -n M-h switch-client -p
bind -n M-l switch-client -n

bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

run '~/.tmux/plugins/tpm/tpm'
bg="#282c34"
bg_alt="#21252b"
bg_darker="#1d2026"
surface="#2c313a"
border="#3e4451"

fg="#abb2bf"
fg_dim="#636d83"
fg_bright="#dde1e8"

red="#e06c75"
orange="#d19a66"
yellow="#e5c07b"
green="#98c379"
cyan="#56b6c2"
blue="#61afef"
purple="#c678dd"

# ─── General ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g status on
set -g status-interval 2
set -g status-position bottom

# ─── Pane Borders ───────────────────────────────────────────────────────────
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"

# ─── Status Bar ─────────────────────────────────────────────────────────────
set -g status-style "bg=#21252b,fg=#abb2bf"
set -g status-left-length 60
set -g status-right-length 100

# Left: session name
set -g status-left "\
#[bg=#61afef,fg=#282c34,bold] 󰣐 #S \
#[bg=#21252b,fg=#61afef]  "

# Right: git branch | path | date/time
set -g status-right "\
#[fg=#3e4451]  \
#[fg=#3e4451]│  \
#[fg=#e5c07b] %a %d %b  \
#[fg=#3e4451]│  \
#[fg=#98c379,bold] %H:%M \
#[bg=#61afef,fg=#282c34,bold]  #h "

# ─── Window / Tab List ──────────────────────────────────────────────────────
set -g status-justify left

# Inactive window
set -g window-status-format "\
#[fg=#636d83,bg=#21252b]  #I \
#[fg=#abb2bf]#W  "

# Active window
set -g window-status-current-format "\
#[fg=#21252b,bg=#61afef]█\
#[fg=#282c34,bg=#61afef,bold] #I  #W \
#[fg=#61afef,bg=#21252b]█"

# Window with activity
set -g window-status-activity-style "fg=#e5c07b,bg=#21252b"

# Window with bell
set -g window-status-bell-style "fg=#e06c75,bg=#21252b,bold"

set -g window-status-separator ""

# ─── Messages ───────────────────────────────────────────────────────────────
set -g message-style "fg=#e5c07b,bg=#2c313a"
set -g message-command-style "fg=#56b6c2,bg=#2c313a"

# ─── Mode (copy mode, etc.) ──────────────────────────────────────────────────
set -g mode-style "fg=#282c34,bg=#61afef"

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
